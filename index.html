<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DTALE Modern: Furniture &amp; Objects</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#FFFFFF;--ink:#1C1B19;--stone:#6F6B64;--soft:#9A958D;--well:#F3F2EF;--rule:#E2DED8;--max:1720px;--gutter:clamp(16px,5vw,96px)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:"Lato","Helvetica Neue",Arial,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:inherit}
a:focus-visible,button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{max-width:var(--max);margin:0 auto;padding:0 var(--gutter)}

/* header: centred logo */
header.top{display:flex;justify-content:center;padding:calc(36px + env(safe-area-inset-top,0px)) 0 0}
.brand{display:inline-flex;text-decoration:none}
.brand img{height:26px;width:auto;display:block}

/* title row */
.intro{display:grid;grid-template-columns:1fr minmax(0,560px);gap:48px;align-items:end;padding:88px 0 56px;border-bottom:1px solid var(--rule)}
.intro h1{font-weight:300;font-size:clamp(40px,4.6vw,64px);line-height:1.04;letter-spacing:-.015em}
.intro p{font-size:16px;color:var(--stone);line-height:1.65}

/* filters */
.filters{padding:28px 0 26px}
.tabs{display:flex;align-items:baseline;gap:24px;font-size:15px;flex-wrap:wrap}
.tabs .lab{color:var(--stone)}
.tab{padding-bottom:5px;border-bottom:1px solid transparent;color:var(--stone)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.sort{margin-left:auto;display:flex;gap:16px;color:var(--stone)}
.sort button{color:var(--stone);padding-bottom:3px;border-bottom:1px solid transparent}
.sort button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:12px 26px;margin-top:22px;font-size:15px}
.chip{color:var(--stone);padding-bottom:3px;border-bottom:1px solid transparent;white-space:nowrap}
.chip:hover{color:var(--ink)}
.chip[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.chip span{font-size:12px;color:var(--soft);margin-left:5px}
.count{margin-top:22px;font-size:13px;color:var(--soft)}

/* grid with hairlines, Esvee-style */
.grid{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--rule);border-left:1px solid var(--rule)}
.cell{display:block;text-decoration:none;padding:30px 30px 34px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);transition:background .2s}
.cell:hover{background:#FBFAF8}
.frame{position:relative;aspect-ratio:4/3;background:var(--well);overflow:hidden}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease}
.cell:hover .frame img{transform:scale(1.025)}
.frame.cut img{inset:auto;height:auto;object-fit:fill}   /* white-backdrop image, placed by its product box */
.cell:hover .frame.cut img{transform:none}
.frame .na{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--soft)}
.name{margin-top:22px;font-size:19px;line-height:1.3;font-weight:400}
.type{margin-top:4px;font-size:13px;color:var(--stone)}
.var{margin-top:2px;font-size:12px;color:var(--soft)}
.empty{padding:80px 0;color:var(--stone)}

footer{margin-top:96px;padding:32px 0 48px;border-top:1px solid var(--rule);display:flex;justify-content:space-between;flex-wrap:wrap;gap:16px;font-size:14px;color:var(--stone)}
footer a{text-decoration:none;border-bottom:1px solid var(--rule)}

@media (max-width:1100px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:760px){
  .brand img{height:20px}
  .intro{grid-template-columns:1fr;gap:18px;padding:52px 0 32px}
  .intro p{font-size:15px}
  .filters{padding:20px 0 18px}
  .sort{margin-left:0;width:100%}
  .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-right:calc(-1*var(--gutter));padding-right:var(--gutter);gap:22px}
  .chips::-webkit-scrollbar{display:none}
  .cell{padding:14px 12px 20px}
  .name{margin-top:12px;font-size:15px}
  .type{font-size:12px}.var{font-size:11px}
}
</style>
</head>

<div class="wrap">
  <header class="top">
    <a class="brand" href="https://www.dtalemodern.com/" target="_blank" rel="noopener" aria-label="DTALE Modern"><img src="https://www.dtalemodern.com/dist/logo-dLf.svg" alt="DTALE Modern" onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:'DTALE MODERN'}))"></a>

</div>
<div class="wrap"><main class="grid" id="grid"></main></div>
<div class="wrap">

</div>

ion"], ["jake-living", "Jake Living"], ["manhattan-collection", "Manhattan Collection"], ["aangan-collection", "Aangan Collection"], ["arc-collection", "Arc Collection"], ["village-collection", "Village Collection"], ["french-country-collection", "French Country Collection"], ["outdoor-furniture", "Outdoor Furniture"], ["thinnai-collection", "Thinnai Collection"], ["kobbler-collection", "Kobbler Collection"], ["marcus-collection", "Marcus Collection"], ["miller-collection", "Miller Collection"], ["haden-collection", "Haden Collection"], ["the-verandah-collection", "Verandah Collection"], ["advi-collection", "Advi Collection"]]};

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const state = {tab:'c', key:'all', sort:'az'};

function readHash(){
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get('collection')) { state.tab='col'; state.key=h.get('collection'); }
  else if (h.get('category')) { state.tab='c'; state.key=h.get('category'); }
  if (h.get('sort')==='new') state.sort='new';
}
function writeHash(){
  const p = new URLSearchParams();
  if (state.key!=='all') p.set(state.tab==='col'?'collection':'category', state.key);
  if (state.sort==='new') p.set('sort','new');
  const s = p.toString(); history.replaceState(null,'', s ? '#'+s : location.pathname+location.search);
}

/* Fit a white-backdrop image so every product fills the same share of its frame. */
const FRAME = 3/4, FILL_W = .80, FILL_H = .74;
function cutStyle(it){
  const [x0,y0,x1,y1] = it.b, ar = it.ar || 1, bw = x1-x0, bh = y1-y0;
  const s = Math.min(FILL_W/bw, FILL_H*FRAME*ar/bh);            // image width as a share of frame width
  const cx = (x0+x1)/2, cy = (y0+y1)/2;
  const left = 50 - cx*s*100, top = 52 - cy*s/(ar*FRAME)*100;
  return `width:${(s*100).toFixed(2)}%;left:${left.toFixed(2)}%;top:${top.toFixed(2)}%`;
}
function card(it){
  const cut = it.w && it.b;
  const src = cut ? it.w : it.i;
  const img = src ? `<img src="${esc(src)}" alt="${esc(it.n)}" loading="lazy" decoding="async"${cut?` style="${cutStyle(it)}"`:''} onerror="this.outerHTML='<span class=&quot;na&quot;>Image unavailable</span>'">`
                  : `<span class="na">Image unavailable</span>`;
  return `<a class="cell" href="${esc(it.u)}" target="_blank" rel="noopener">
    <div class="frame${cut?' cut':''}"${cut&&it.bg?` style="background:${esc(it.bg)}"`:''}>${img}</div>
    <div class="name">${esc(it.n)}</div>
    ${it.t?`<div class="type">${esc(it.t)}</div>`:''}
    ${it.v?`<div class="var">${esc(it.v)}</div>`:''}
  </a>`;
}
function counts(){
  const by = {};
  for (const it of DATA.items){
    if (state.tab==='c') by[it.g]=(by[it.g]||0)+1;
    else for (const c of it.c) by[c]=(by[c]||0)+1;
  }
  return by;
}
function render(){
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected', String(b.dataset.tab===state.tab)));
  document.querySelectorAll('[data-sort]').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.sort===state.sort)));
  const list = state.tab==='c' ? DATA.cats : DATA.colls, by = counts();
  const total = state.tab==='c' ? DATA.items.length : DATA.items.filter(i=>i.c.length).length;
  $('#chips').innerHTML = `<button class="chip" data-k="all" aria-pressed="${state.key==='all'}">All<span>${total}</span></button>` +
    list.map(([k,l])=>`<button class="chip" data-k="${esc(k)}" aria-pressed="${state.key===k}">${esc(l)}<span>${by[k]||0}</span></button>`).join('');
  let items = DATA.items.filter(it => state.key==='all' ? (state.tab==='c' || it.c.length) : (state.tab==='c' ? it.g===state.key : it.c.includes(state.key)));
  items = items.slice().sort(state.sort==='new'
    ? (a,b)=> (b.d||'').localeCompare(a.d||'') || a.n.localeCompare(b.n)
    : (a,b)=> a.n.localeCompare(b.n) || (a.v||'').localeCompare(b.v||''));
  $('#count').textContent = `${items.length} ${items.length===1?'piece':'pieces'}`;
  $('#grid').innerHTML = items.length ? items.map(card).join('') : '<p class="empty">Nothing here yet.</p>';
  const on = document.querySelector('.chip[aria-pressed="true"]'); if (on) on.scrollIntoView({block:'nearest',inline:'nearest'});
}
document.querySelector('.tabs').addEventListener('click', e=>{
  const t = e.target.closest('.tab'), s = e.target.closest('[data-sort]');
  if (t && t.dataset.tab!==state.tab){ state.tab=t.dataset.tab; state.key='all'; }
  if (s) state.sort = s.dataset.sort;
  if (t||s){ writeHash(); render(); }
});
$('#chips').addEventListener('click', e=>{
  const c = e.target.closest('.chip'); if (!c) return;
  state.key = c.dataset.k; writeHash(); render();
});
readHash(); render();
</script>
